name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint & YAML parser
        run: pip install ruff PyYAML
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Validate Agent Skill (agentskills.io)
        run: python scripts/validate_skill.py
      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py
      - name: Check dependency license notices
        run: python scripts/check_licenses.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run test suite (non-PDF)
        run: python -m pytest -q --ignore=tests/test_format_pdf.py

  test-pdf-optional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev and optional pdf extra
        run: pip install -e ".[dev,pdf]"
      - name: Run full test suite including PDF prototype
        run: python -m pytest -q
